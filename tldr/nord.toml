# tealdeer (tldr) colours in the Nord palette (https://www.nordtheme.com),
# for the Ctrl-b h popup only (shell/tldr-popup.sh passes --config-path).

[style.description]
foreground = { rgb = { r = 216, g = 222, b = 233 } }   # nord4

[style.command_name]
foreground = { rgb = { r = 136, g = 192, b = 208 } }   # nord8
bold = true

[style.example_text]
foreground = { rgb = { r = 129, g = 161, b = 193 } }   # nord9

[style.example_code]
foreground = { rgb = { r = 236, g = 239, b = 244 } }   # nord6

[style.example_variable]
foreground = { rgb = { r = 235, g = 203, b = 139 } }   # nord13
underline = true
