# claudebro_panes — pane border titles, popups, session switching, alerts.
# Sourced from ~/.tmux.conf by install.sh; not meant to be edited in place.
# Popups need tmux 3.2+.

# This repo's root, for the scripts bound below. Expanded once, at load
# time: #{current_file} only has a value while this file is being read.
set -gF @claudebro "#{d:current_file}/.."

# Labels are keyed off a per-pane user option (@role) set by ta(), not off
# #{pane_title}: Claude Code continuously rewrites its own pane title to the
# current conversation topic, so a title set with `select-pane -T` does not
# survive. Panes without an @role fall back to showing their pane title.
set -g pane-border-status top
set -g pane-border-format " #{?#{==:#{@role},claude},◆ claude session,#{?#{==:#{@role},commands},▸ commands,#{pane_title}}} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour110"

# --- Popups ------------------------------------------------------------
# Prefix keys rather than Alt- ones: Claude Code and readline already use
# most Alt combinations (Alt-t toggles thinking, Alt-b/f move by word).
# -EE closes the popup on a clean exit but keeps it open on an error, so a
# missing tool shows "command not found" instead of flashing shut.
bind g display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind b display-popup -EE -w 90% -h 90% btop
bind S display-popup -E  -w 80% -h 70% -d "#{pane_current_path}"
bind j display-popup -E  -w 60% -h 50% "'#{@claudebro}/shell/pick-session.sh' '#{client_name}'"

# --- Alerts ------------------------------------------------------------
# claude/bell.sh (a Claude Code Stop/Notification hook) rings the bell in
# Claude's pane. tmux flags the window, and status-right below lists every
# session with a flagged window until you visit it. bell-action other +
# visual-bell: no audible beep, and nothing for the window you're looking at.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell on

# --- Status bar --------------------------------------------------------
# Right side: sessions waiting on you (click to open the picker), a [+]
# button for a new ta session, a [git] button for lazygit, then tmux's
# usual pane title and clock.
set -g status-right-length 120
set -g status-right "#{S:#{?session_alerts,#[range=user|cb_pick]#[fg=colour16 bg=colour214 bold] #{session_name} ! #[norange default] ,}}#[range=user|cb_new]#[fg=colour252 bg=colour238] + #[norange default] #[range=user|cb_git]#[fg=colour252 bg=colour238] git #[norange default] \"#{=21:pane_title}\" %H:%M %d-%b-%y"

# Left-click the session name at the bottom left to pick a session from a
# list (arrows/Enter, or click). Right-click keeps tmux's built-in menu.
bind -n MouseDown1StatusLeft choose-tree -Zs

# Clicks on the status-right buttons arrive as MouseDown1Status with the
# button's name in mouse_status_range; anything else keeps tmux's default
# of selecting the clicked window.
bind -n MouseDown1Status \
  if -F "#{==:#{mouse_status_range},cb_new}" {
    command-prompt -p "new session:" { run-shell "'#{@claudebro}/shell/claudebro-session' '%%' '#{client_name}'" }
  } {
    if -F "#{==:#{mouse_status_range},cb_git}" {
      display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" lazygit
    } {
      if -F "#{==:#{mouse_status_range},cb_pick}" {
        display-popup -E -w 60% -h 50% "'#{@claudebro}/shell/pick-session.sh' '#{client_name}'"
      } {
        select-window -t =
      }
    }
  }
