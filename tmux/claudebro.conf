# claudebro_panes — pane border titles, popups, session switching, alerts.
# Sourced from ~/.tmux.conf by install.sh; not meant to be edited in place.
# Popups need tmux 3.2+.

# This repo's root, for the scripts bound below. Expanded once, at load
# time: #{current_file} only has a value while this file is being read.
set -gF @claudebro "#{d:current_file}/.."

# Shift+Enter for a new line in Claude Code's prompt. Without extended keys
# tmux sends it on as a plain Enter, which submits. `on` (not `always`) only
# sends them to apps that ask, so older programs see the keys they expect.
# terminal-features is read when a client attaches: detach and reattach after
# changing it.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Plain 256-colour defaults for the borders, alert chips and buttons below.
# tmux/nord.conf (loaded at the end of this file) replaces them with Nord.
set -g @cb_border    "colour240"
set -g @cb_border_on "colour110"
set -g @cb_alert_fg  "colour16"
set -g @cb_alert_bg  "colour214"
set -g @cb_btn_fg    "colour252"
set -g @cb_btn_bg    "colour238"

# Labels are keyed off a per-pane user option (@role) set by ta(), not off
# #{pane_title}: Claude Code continuously rewrites its own pane title to the
# current conversation topic, so a title set with `select-pane -T` does not
# survive. Panes without an @role fall back to showing their pane title.
set -g pane-border-status top
set -g pane-border-format " #{?#{==:#{@role},claude},◆ claude session,#{?#{==:#{@role},commands},▸ commands,#{pane_title}}} "
set -gF pane-border-style "fg=#{@cb_border}"
set -gF pane-active-border-style "fg=#{@cb_border_on}"

# --- Popups ------------------------------------------------------------
# Prefix keys rather than Alt- ones: Claude Code and readline already use
# most Alt combinations (Alt-t toggles thinking, Alt-b/f move by word).
# -EE closes the popup on a clean exit but keeps it open on an error, so a
# missing tool shows "command not found" instead of flashing shut.
# display-popup does not expand #{...} in its command, so popups that need
# a path from @claudebro go through `run-shell -C`, which expands first.
bind g run-shell -C "display-popup -EE -w 90% -h 90% -d \"#{pane_current_path}\" \"'#{@claudebro}/shell/lazygit-popup.sh'\""
bind b run-shell -C "display-popup -EE -w 90% -h 90% \"'#{@claudebro}/shell/btop-popup.sh'\""
bind S display-popup -E  -w 80% -h 70% -d "#{pane_current_path}"
bind v run-shell -C "display-popup -EE -w 90% -h 90% -d \"#{pane_current_path}\" \"'#{@claudebro}/shell/glow-popup.sh'\""
bind h run-shell -C "display-popup -E  -w 90% -h 80% \"'#{@claudebro}/shell/tldr-popup.sh'\""
bind T run-shell -C "display-popup -E -w 90% -h 90% \"'#{@claudebro}/shell/team-glance.sh'\""
bind C run-shell "'#{@claudebro}/shell/team-window.sh'"
bind j run-shell -C "display-popup -E -w 60% -h 50% \"'#{@claudebro}/shell/pick-session.sh' '#{client_name}'\""
bind A run-shell -C "display-popup -E -w 90% -h 80% \"'#{@claudebro}/shell/approvals.sh'\""
bind P run-shell -C "display-popup -E -w 90% -h 60% \"'#{@claudebro}/shell/prompts-popup.sh' '#{window_id}'\""

# --- Tablet keyboard ---------------------------------------------------
# Keeps an on-screen keyboard from pushing Claude's pane up: on a tablet a
# pinned window keeps its keyboard-down size and the keyboard just covers
# the shell. shell/pin-layout.sh has the details. It gets the client's size
# (height less the status line) when a client resizes or changes window or
# session, and the window's when tmux resizes one. Hook index 10 so a hook
# of your own at [0] isn't replaced.
set -g @cb_win_h "#{?#{==:#{status},off},#{client_height},#{e|-:#{client_height},#{?#{==:#{status},on},1,#{status}}}}"
set -g @cb_pin_client "run-shell \"'#{@claudebro}/shell/pin-layout.sh' '#{window_id}' '#{client_width}' '#{E:@cb_win_h}'\""
source-file -q "~/.local/state/claudebro/keyboard.conf"
set-hook -g client-resized[10] "run-shell -C '#{@cb_pin_client}'"
set-hook -g session-window-changed[10] "run-shell -C '#{@cb_pin_client}'"
set-hook -g client-session-changed[10] "run-shell -C '#{@cb_pin_client}'"
set-hook -g window-resized[10] "run-shell \"'#{@claudebro}/shell/pin-layout.sh' '#{window_id}' '#{window_width}' '#{window_height}'\""

# --- Alerts ------------------------------------------------------------
# claude/bell.sh (a Claude Code Stop/Notification hook) rings the bell in
# Claude's pane. tmux flags the window, and its tab turns orange with a !
# until you visit it. bell-action other + visual-bell: no audible beep, and
# nothing for the window you're looking at.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell on

# --- Status bar --------------------------------------------------------
# Per-window Claude state, appended after #W in the window tabs: loops the
# window's panes and, for one running claude, shows ○ when idle, ● when
# working and ◆ when it waits on you (a permission prompt or question).
# claude/state.sh (Claude Code hooks) keeps that in the pane's @cb_busy;
# the pane title can't tell, it starts with ✳ either way. Windows without
# Claude show nothing. Kept in an option so the plain formats here and the
# Nord ones share it.
set -g @cb_state "#{P:#{?#{==:#{pane_current_command},claude},#{?#{==:#{@cb_busy},wait}, ◆,#{?#{@cb_busy}, ●, ○}},}}"
# The session's state, after its name at the bottom left: its most urgent
# Claude, ◆ over ● over ○ (nothing without Claude). tmux/nord.conf also
# turns the name yellow on ◆.
set -g @cb_glyphs "#{W:#{E:@cb_state}}"
set -g @cb_sess "#{?#{m:*◆*,#{E:@cb_glyphs}}, ◆,#{?#{m:*●*,#{E:@cb_glyphs}}, ●,#{?#{m:*○*,#{E:@cb_glyphs}}, ○,}}}"
# Window names stay compact until there's an alert: the current window
# shows its name cut to 5 characters, a window whose bell is flagged (Claude
# needs you) its full name, the others just their number and state glyph.
# Clients too narrow for even that get compact tabs: no flags, and alerted
# windows cut to 5 characters too.
# "Too narrow" is measured, not a fixed cut-off: @cb_full_w is the width of
# the full tabs (the plain text of tmux/nord.conf's tabs, arrows and padding
# included), plus the session name, plus @cb_status_reserve for the arrows
# around it and status-right's chips and buttons. Measured from the full
# form even while compact, so the bar can't flip back and forth.
# Formats are drawn per client, so a desktop attached at the same time
# keeps the full bar.
set -g @cb_status_reserve 32
set -g @cb_wname_full "#{?window_bell_flag,#{window_name},#{?window_active,#{=5:window_name},}}"
set -g @cb_full_w "#{e|+:#{w:#{W:x #I#{?#{E:@cb_wname_full}, x ,}#{E:@cb_wname_full}#{E:@cb_state} #F x}},#{e|+:#{w:#{session_name}#{E:@cb_sess}},#{@cb_status_reserve}}}"
set -g @cb_narrow "#{e|>:#{E:@cb_full_w},#{client_width}}"
set -g @cb_wname "#{?#{E:@cb_narrow},#{?#{||:#{window_bell_flag},#{window_active}},#{=5:window_name},},#{E:@cb_wname_full}}"
# The tabs themselves are @cb_tab / @cb_tab_cur, so tmux/nord.conf can
# restyle them and keep the scrolling below.
set -g @cb_tab "#I#{?#{E:@cb_wname},:#{E:@cb_wname},}#{E:@cb_state}#{?#{E:@cb_narrow}, ,#{?window_flags,#{window_flags}, }}"
set -g @cb_tab_cur "#I#{?#{E:@cb_wname},:#{E:@cb_wname},}#{E:@cb_state}#{?#{E:@cb_narrow}, ,#{?window_flags,#{window_flags}, }}"
# Scrolling, for narrow clients only: tabs left of the session's @cb_scroll_from
# window index draw as nothing. The ‹ › buttons at the start of
# status-right move it (shell/status-scroll.sh); switching windows unsets
# it, and tmux's own list keeps the current window in view again.
set -g @cb_hidden "#{&&:#{E:@cb_narrow},#{e|<:#{window_index},#{?@cb_scroll_from,#{@cb_scroll_from},0}}}"
set -g @cb_scroll_btns "#{?#{E:@cb_narrow},#[range=user|cb_scroll_l]#[fg=#{@cb_btn_fg} bg=#{@cb_btn_bg}] ‹ #[norange default] #[range=user|cb_scroll_r]#[fg=#{@cb_btn_fg} bg=#{@cb_btn_bg}] › #[norange default] ,}"
set-hook -g session-window-changed[11] "run-shell \"tmux set -u -t '#{session_id}' @cb_scroll_from\""
set -g window-status-format "#{?#{E:@cb_hidden},,#{E:@cb_tab}}"
set -g window-status-current-format "#{?#{E:@cb_hidden},,#{E:@cb_tab_cur}}"
# Short enough that the glyphs follow Claude's state.
set -g status-interval 3

# Right side: how many Claudes wait on a prompt (click for the approvals
# popup), a [+] button for a new window with the Claude + shell layout and
# a [say] button for the canned-prompts popup (Ctrl-b P). No clock. Built
# from @cb_alerts and @cb_buttons so a theme (tmux/nord.conf) can restyle
# the pieces while keeping their click ranges. Styles inside @cb_alerts use
# spaces, not commas: a comma would end the #{?...} branch.
# @cb_waiting_chip: "N waiting" when Claudes are sitting on a prompt (click
# for the Ctrl-b A approvals popup). The #() re-counts them into
# @cb_waiting each status-interval, so the chip lags by up to one refresh.
set -g @cb_waiting_chip "#('#{@claudebro}/shell/approvals.sh' --status)#{?#{&&:#{@cb_waiting},#{!=:#{@cb_waiting},0}},#[range=user|cb_ok]#[fg=#{@cb_alert_fg} bg=#{@cb_alert_bg} bold] #{@cb_waiting} waiting #[norange default] ,}"
set -g @cb_alerts "#{E:@cb_waiting_chip}"
set -g @cb_buttons "#[range=user|cb_new]#[fg=#{@cb_btn_fg} bg=#{@cb_btn_bg}] + #[norange default] #[range=user|cb_say]#[fg=#{@cb_btn_fg} bg=#{@cb_btn_bg}] say #[norange default] "
set -g status-right-length 120
set -g status-right "#{E:@cb_scroll_btns}#{E:@cb_alerts}#{E:@cb_buttons}"

# Left-click the session name at the bottom left to pick a session from a
# list (arrows/Enter, or click). Right-click keeps tmux's built-in menu.
bind -n MouseDown1StatusLeft choose-tree -Zs

# Clicks on the status-right buttons arrive as MouseDown1Status with the
# button's name in mouse_status_range; anything else keeps tmux's default
# of selecting the clicked window.
bind -n MouseDown1Status \
  if -F "#{m:cb_scroll_*,#{mouse_status_range}}" {
    run-shell "'#{@claudebro}/shell/status-scroll.sh' '#{session_id}' '#{?#{==:#{mouse_status_range},cb_scroll_l},left,right}' '#{client_name}'"
  } {
  if -F "#{==:#{mouse_status_range},cb_new}" {
    command-prompt -p "new window (blank for default name):" { run-shell "'#{@claudebro}/shell/claudebro-window' '%%' '#{session_id}' '#{pane_current_path}'" }
  } {
    if -F "#{==:#{mouse_status_range},cb_ok}" {
      run-shell -C "display-popup -E -w 90% -h 80% \"'#{@claudebro}/shell/approvals.sh'\""
    } {
    if -F "#{==:#{mouse_status_range},cb_say}" {
      run-shell -C "display-popup -E -w 90% -h 60% \"'#{@claudebro}/shell/prompts-popup.sh' '#{window_id}'\""
    } {
      select-window -t =
    }
    }
  }
  }

# --- Theme -------------------------------------------------------------
# Nord, last so it wins. To keep tmux's own colours instead, put
#   set -g @claudebro_theme none
# in ~/.tmux.conf before the claudebro_panes block (and restart tmux: a
# reload can't un-set styles that were already applied).
if -F "#{!=:#{@claudebro_theme},none}" {
  source-file -F "#{@claudebro}/tmux/nord.conf"
}
