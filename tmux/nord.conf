# claudebro_panes — Nord theme. Sourced at the end of claudebro.conf.
#
# Palette from https://www.nordtheme.com, status bar layout after the
# official port (nordtheme/tmux). Written out here rather than loading that
# port: it uses ANSI colour names that only look like Nord in a terminal
# that itself runs a Nord palette, sets options tmux 3.x removed, and
# replaces status-right wholesale (losing the alert chips and buttons).
# The btop popup has a matching theme: btop/themes/nord.theme.

set -g @nord0  "#2E3440"   # popup background
set -g @nord1  "#3B4252"   # status and menu background
set -g @nord3  "#4C566A"   # inactive windows, buttons, borders
set -g @nord4  "#D8DEE9"   # text
set -g @nord6  "#ECEFF4"   # selected text
set -g @nord8  "#88C0D0"   # current window, active border (frost cyan)
set -g @nord9  "#81A1C1"   # session name (frost blue)
set -g @nord10 "#5E81AC"   # selection (frost dark blue)
set -g @nord13 "#EBCB8B"   # alerts (aurora yellow)

# --- Status bar --------------------------------------------------------
set -gF status-style "bg=#{@nord1},fg=#{@nord4}"
set -g status-left-length 30
set -gF window-status-bell-style "fg=#{@nord1},bg=#{@nord13}"
set -gF window-status-activity-style "fg=#{@nord1},bg=#{@nord8}"
set -gF message-style "fg=#{@nord8},bg=#{@nord3}"
set -gF message-command-style "fg=#{@nord8},bg=#{@nord3}"

# claudebro.conf's plain chips and buttons read these at draw time.
set -gF @cb_alert_fg "#{@nord1}"
set -gF @cb_alert_bg "#{@nord13}"
set -gF @cb_btn_fg   "#{@nord4}"
set -gF @cb_btn_bg   "#{@nord3}"

# Powerline arrow segments, as in the official port's patched-font layout.
# They need a Powerline or Nerd Font in the terminal you connect FROM. If
# the arrows show as boxes or "?", put
#   set -g @claudebro_nord_glyphs off
# in ~/.tmux.conf before the claudebro_panes block for plain blocks.
# Inside @cb_alerts, styles use spaces rather than commas (see claudebro.conf).
%if "#{!=:#{@claudebro_nord_glyphs},off}"
set -g @nord_r  ""   # solid arrow, pointing right
set -g @nord_rt ""   # thin divider, pointing right
set -g @nord_l  ""   # solid arrow, pointing left
set -g @nord_lt ""   # thin divider, pointing left

set -g status-left "#[fg=#{@nord1},bg=#{@nord9},bold] #S #[fg=#{@nord9},bg=#{@nord1},nobold]#{@nord_r}"
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@nord1},bg=#{@nord3}]#{@nord_r}#[fg=#{@nord4},bg=#{@nord3}] #I #{@nord_rt} #W #F #[fg=#{@nord3},bg=#{@nord1}]#{@nord_r}"
set -g window-status-current-format "#[fg=#{@nord1},bg=#{@nord8}]#{@nord_r}#[fg=#{@nord1},bg=#{@nord8},bold] #I #{@nord_rt} #W #F #[fg=#{@nord8},bg=#{@nord1},nobold]#{@nord_r}"

# Alert chips and buttons as arrow-capped boxes, keeping claudebro.conf's
# click ranges (cb_pick / cb_new / cb_git).
set -g @cb_alerts "#{S:#{?session_alerts,#[range=user|cb_pick]#[fg=#{@nord13} bg=#{@nord1}]#{@nord_l}#[fg=#{@nord1} bg=#{@nord13} bold] #{session_name} ! #[fg=#{@nord13} bg=#{@nord1} nobold]#{@nord_r}#[norange default] ,}}"
set -g @cb_buttons "#[range=user|cb_new]#[fg=#{@nord3},bg=#{@nord1}]#{@nord_l}#[fg=#{@nord4},bg=#{@nord3}] + #[fg=#{@nord3},bg=#{@nord1}]#{@nord_r}#[norange default] #[range=user|cb_git]#[fg=#{@nord3},bg=#{@nord1}]#{@nord_l}#[fg=#{@nord4},bg=#{@nord3}] git #[fg=#{@nord3},bg=#{@nord1}]#{@nord_r}#[norange default] "

# The port's right side: date, time, host.
set -g status-right "#{E:@cb_alerts}#{E:@cb_buttons}#[fg=#{@nord3},bg=#{@nord1}]#{@nord_l}#[fg=#{@nord4},bg=#{@nord3}] %Y-%m-%d #{@nord_lt} %H:%M #[fg=#{@nord8},bg=#{@nord3}]#{@nord_l}#[fg=#{@nord1},bg=#{@nord8},bold] #H "
%else
set -g status-left "#[fg=#{@nord1},bg=#{@nord9},bold] #S #[default] "
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@nord4},bg=#{@nord3}] #I #W #F "
set -g window-status-current-format "#[fg=#{@nord1},bg=#{@nord8},bold] #I #W #F "
%endif

# --- Everything else ---------------------------------------------------
set -gF pane-border-style "fg=#{@nord3}"
set -gF pane-active-border-style "fg=#{@nord8}"
set -gF popup-style "bg=#{@nord0},fg=#{@nord4}"
set -gF popup-border-style "fg=#{@nord9}"
set -gF menu-style "bg=#{@nord1},fg=#{@nord4}"
set -gF menu-selected-style "bg=#{@nord8},fg=#{@nord1}"
set -gF menu-border-style "fg=#{@nord3}"
set -gF mode-style "bg=#{@nord10},fg=#{@nord6}"
set -gF clock-mode-colour "#{@nord8}"
set -gF display-panes-colour "#{@nord3}"
set -gF display-panes-active-colour "#{@nord8}"
